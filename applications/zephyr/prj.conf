# Zephyr 应用配置（仅供 --rtos zephyr 使用）
#
# OSAL → Zephyr 适配层依赖：
#   - 系统堆：k_malloc / k_free（osal_memory、以及各内核对象动态分配所需）
#     → 需 CONFIG_KERNEL_MEM_POOL + CONFIG_HEAP_MEM_POOL_SIZE
#   - 动态线程栈：k_thread_stack_alloc（osal_thread_create 支持 stack=NULL）
#     → 需 CONFIG_DYNAMIC_THREAD(+ALLOC)，取代已移除的 CONFIG_THREAD_STACK_ALLOCATOR
CONFIG_KERNEL_MEM_POOL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

# LED 模块 -> drivers/gpio 的 Zephyr 后端（zephyr_gpio.c）依赖 Zephyr GPIO 驱动
CONFIG_GPIO=y
CONFIG_GPIO_STM32=y

# 启动延时：等待 USB 串口(CH340)在复位后完成重连并稳定，再打印启动横幅，
# 避免开机首屏丢在串口重连窗口（配合 tools/watch-serial.sh 抓 DAP 触发的重启首屏）
CONFIG_BOOT_DELAY=3000

# ---- 打开 Zephyr 日志子系统，输出完整系统启动日志（默认关闭，只有 banner）----
CONFIG_LOG=y
# 日志等级：1=err 2=warn 3=info 4=debug（注意：kconfig 不支持在 =值后写 # 注释）
CONFIG_LOG_DEFAULT_LEVEL=3
# 日志走 UART 串口输出（与心跳共用 UART1）
CONFIG_LOG_BACKEND_UART=y